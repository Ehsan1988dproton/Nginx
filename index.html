<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سامانه هوشمند پایش و مدیریت جامع</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --screen-bg: #091322;
      --card-bg: rgba(14, 26, 46, 0.92);
      --card-border: #1e3a5f;
      --accent-cyan: #00d2ff;
      --accent-green: #00e676;
      --accent-orange: #ff9100;
      --text-main: #ffffff;
      --text-muted: #8ea3bf;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    body {
      background: #040810;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      direction: rtl;
    }
    .monitor-bezel {
      background: linear-gradient(135deg, #a6b2c2 0%, #d8e2ee 30%, #8292a6 70%, #5d6d82 100%);
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.85);
      width: 100%;
      max-width: 960px;
      position: relative;
    }
    .screw { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #4a5768; }
    .screw.tl { top: 8px; left: 10px; }
    .screw.tr { top: 8px; right: 10px; }
    .screw.bl { bottom: 8px; left: 10px; }
    .screw.br { bottom: 8px; right: 10px; }

    .screen-wrapper {
      background: #000;
      padding: 6px;
      border-radius: 8px;
      border: 2px solid #2f3e53;
    }
    .screen-content {
      background: radial-gradient(circle at 50% 30%, #0d1e38 0%, #060d19 100%);
      color: var(--text-main);
      border-radius: 4px;
      padding: 20px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 20px;
    }
    .grid-container {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
    }
    .card-title {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-weight: bold;
    }
    .status-val {
      font-size: 24px;
      color: var(--accent-green);
      font-weight: bold;
      margin: 8px 0;
    }
    .gauges-box {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .circle-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .circle {
      width: 95px;
      height: 95px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .c-cyan { border: 3px solid var(--accent-cyan); }
    .c-green { border: 3px solid var(--accent-green); }
    .c-orange { border: 3px solid var(--accent-orange); }

    .sub-box {
      margin-top: 16px;
      background: rgba(0,0,0,0.4);
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px dashed var(--accent-cyan);
      display: flex;
      gap: 10px;
    }
    .sub-box input {
      background: transparent;
      border: none;
      color: #fff;
      width: 100%;
      outline: none;
      direction: ltr;
      font-size: 12px;
    }
    .btn-copy {
      background: var(--accent-cyan);
      color: #000;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    .qr-area {
      display: flex;
      justify-content: center;
      margin-top: 14px;
    }
    .qr-card {
      background: #fff;
      padding: 8px;
      border-radius: 10px;
    }
    @media (max-width: 768px) {
      .grid-container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="monitor-bezel">
    <div class="screw tl"></div>
    <div class="screw tr"></div>
    <div class="screw bl"></div>
    <div class="screw br"></div>

    <div class="screen-wrapper">
      <div class="screen-content">

        <div class="panel-header">
          <div style="color: var(--accent-cyan); font-weight: bold; font-size: 14px;">
            <i class="fa-solid fa-microchip"></i> سامانه هوشمند پایش و مدیریت جامع
          </div>
          <div id="liveClock" style="color: var(--text-muted); font-size: 13px;">--:--</div>
        </div>

        <div class="grid-container">
          <div class="card">
            <div class="card-title">وضعیت کلی سیستم</div>
            <div class="status-val"><i class="fa-solid fa-circle-check"></i> فعال</div>
            <div style="color: var(--text-muted); font-size: 12px;">سرویس در وضعیت نرمال و عملیاتی قرار دارد.</div>
            
            <div class="qr-area">
              <div class="qr-card" id="qrcode"></div>
            </div>
          </div>

          <div class="card">
            <div class="card-title">پایش لحظه‌ای پارامترها</div>
            <div class="gauges-box">
              <div class="circle-item">
                <div class="circle c-cyan">
                  <span id="usedVal">--</span>
                  <small style="font-size: 9px; color: var(--text-muted)">GB</small>
                </div>
                <span style="font-size: 11px; color: var(--text-muted);">توان خروجی (مصرف)</span>
              </div>

              <div class="circle-item">
                <div class="circle c-green">
                  <span id="remVal">--</span>
                  <small style="font-size: 9px; color: var(--text-muted)">GB</small>
                </div>
                <span style="font-size: 11px; color: var(--text-muted);">ولتاژ خط (باقیمانده)</span>
              </div>

              <div class="circle-item">
                <div class="circle c-orange">
                  <span id="expVal">--</span>
                </div>
                <span style="font-size: 11px; color: var(--text-muted);">دمای محیط (اعتبار)</span>
              </div>
            </div>
          </div>
        </div>

        <div class="sub-box">
          <input type="text" id="subInput" readonly>
          <button class="btn-copy" onclick="copySub()">کپی لینک اشتراک</button>
        </div>

      </div>
    </div>
  </div>

  <script>
    // ساعت زنده
    function updateClock() {
      const d = new Date();
      document.getElementById('liveClock').innerText = 
        String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ست کردن لینک و QR
    const currentUrl = window.location.href;
    document.getElementById('subInput').value = currentUrl;

    new QRCode(document.getElementById("qrcode"), {
      text: currentUrl,
      width: 120,
      height: 120,
      colorDark : "#000000",
      colorLight : "#ffffff"
    });

    function copySub() {
      const el = document.getElementById('subInput');
      el.select();
      navigator.clipboard.writeText(el.value);
      alert('لینک اشتراک کپی شد!');
    }

    // خواندن خودکار هدر مشخصات کاربر از سرور
    fetch(currentUrl, {
      headers: { 'Accept': 'text/plain' }
    }).then(res => {
      const info = res.headers.get('subscription-userinfo');
      if (info) {
        let upload = 0, download = 0, total = 0, expire = 0;
        info.split(';').forEach(item => {
          const [k, v] = item.trim().split('=');
          if (k === 'upload') upload = parseInt(v) || 0;
          if (k === 'download') download = parseInt(v) || 0;
          if (k === 'total') total = parseInt(v) || 0;
          if (k === 'expire') expire = parseInt(v) || 0;
        });
        const usedGB = ((upload + download) / (1024 ** 3)).toFixed(2);
        const totalGB = (total / (1024 ** 3)).toFixed(0);
        const remGB = (totalGB - usedGB).toFixed(2);
        document.getElementById('usedVal').innerText = usedGB;
        document.getElementById('remVal').innerText = total > 0 ? remGB : 'نامحدود';
        if (expire > 0) {
          const days = Math.ceil((new Date(expire * 1000) - new Date()) / (1000 * 60 * 60 * 24));
          document.getElementById('expVal').innerText = days + ' روز';
        }
      }
    }).catch(e => console.log(e));
  </script>
</body>
</html>
